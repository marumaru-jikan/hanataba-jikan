<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花たばじかん</title>
<meta name="theme-color" content="#FFE14D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="花たばじかん">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: 海月時間と同じ1カラムのスマホ画面。上に花だん、下にタブ。小学生向けに文字とボタンを大きめに */
:root{
  --bg:#FFFAD9; --bg-top:#FFE14D; --surface:#FFFFFF; --sunk:#FFF4AE; --ink:#3F2E05; --muted:#806618; --line:#FFE37A;
  --leaf:#A06A00; --leaf-soft:#FFF09A; --btn:#FFD60A; --btn-ink:#3F2E05;
  --rose:#FF8A7A; --rose-soft:#FFE6DE; --rose-ink:#8A2A1C; --sun:#F5B400; --brown:#7A4E2A;
  --soil:#E8CC94; --wrap:#FFF8D2; --wrap-line:#F7DE86; --stem:#5DB34E;
  --good:#2F8A33; --good-bg:#E2F5D2; --bad:#C24E36; --bad-bg:#FDE2D8;
  --sky1:#FFE24F; --sky2:#FFFAD9; --hill:#B5E26A;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-kj:"Klee One","BIZ UDPGothic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E190C; --bg-top:#3A2F0E; --surface:#2A2312; --sunk:#231D0E; --ink:#FFF3D1; --muted:#CDB98A; --line:#46391A;
  --leaf:#FFD84A; --leaf-soft:#3E3410; --btn:#FFD60A; --btn-ink:#2A1E05;
  --rose:#F7A399; --rose-soft:#3F2420; --rose-ink:#FFD9D2; --sun:#E6B000; --brown:#C08A5A;
  --soil:#4E3E26; --wrap:#3A3120; --wrap-line:#55472C; --stem:#7FC172;
  --good:#8BD08A; --good-bg:#1D3320; --bad:#EC8A70; --bad-bg:#3C2119;
  --sky1:#3A300F; --sky2:#26200E; --hill:#3F5A2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E190C; --bg-top:#3A2F0E; --surface:#2A2312; --sunk:#231D0E; --ink:#FFF3D1; --muted:#CDB98A; --line:#46391A;
  --leaf:#FFD84A; --leaf-soft:#3E3410; --btn:#FFD60A; --btn-ink:#2A1E05;
  --rose:#F7A399; --rose-soft:#3F2420; --rose-ink:#FFD9D2; --sun:#E6B000; --brown:#C08A5A;
  --soil:#4E3E26; --wrap:#3A3120; --wrap-line:#55472C; --stem:#7FC172;
  --good:#8BD08A; --good-bg:#1D3320; --bad:#EC8A70; --bad-bg:#3C2119;
  --sky1:#3A300F; --sky2:#26200E; --hill:#3F5A2A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
ruby rt{font-size:.5em;font-weight:400}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--leaf);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px}
.hello{padding-block:10px 4px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--leaf);font-weight:700}

/* 花だん（ホームの上） */
.garden{position:relative;border-radius:24px;overflow:hidden;min-height:176px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 80%);border:2px solid var(--line)}
.garden .art{position:absolute;inset:0;width:100%;height:100%}
.garden .txt{position:relative;padding:18px 18px 18px;max-width:62%;display:flex;flex-direction:column;gap:4px}
.garden .name{font-family:var(--f-display);font-weight:900;font-size:.9rem;letter-spacing:.14em;color:var(--leaf)}
.garden h1{font-size:1.35rem}
.garden p{font-size:.92rem;color:var(--muted)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.sway.d2{animation-duration:6s;animation-delay:-2s}.sway.d3{animation-duration:5.5s;animation-delay:-3.5s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{display:block;font-size:.8rem;line-height:1.35;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--btn);color:var(--btn-ink);border:0;border-radius:22px;padding:16px 20px;box-shadow:0 4px 0 var(--sun)}
.continue small{display:block;opacity:.88;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.15rem}
.continue .go{font-size:1.4rem}

.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 12px 12px;min-height:96px}
.grade .k{font-family:var(--f-display);font-size:1.9rem;font-weight:900;line-height:1;color:var(--leaf)}
.grade b{font-family:var(--f-display);font-size:1rem}
.grade.me{border:2px solid var(--btn);background:var(--leaf-soft)}
.grade.me .k{color:var(--leaf)}
.grade .me-tag{position:absolute;top:8px;right:8px;font-size:.66rem;font-weight:700;background:var(--btn);color:var(--btn-ink);border-radius:99px;padding:0 7px}

.gchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gchip{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 0 4px;line-height:1.2}
.gchip b{font-family:var(--f-display);font-size:1.35rem;font-weight:900}
.gchip span{font-size:.68rem;color:var(--muted)}
.gchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.gchip.on span{color:var(--btn-ink)}
.gchip:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.list{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--rose-soft);color:var(--rose-ink)}
.lid{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:900;font-family:var(--f-display);font-size:1.05rem}
.lid.done{background:var(--btn);color:var(--btn-ink)}
.lid.petal{border-radius:50% 50% 50% 8%;transform:rotate(-45deg)}
.lid.petal span{transform:rotate(45deg)}
.secrow{padding:10px 16px 6px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--leaf);background:var(--sunk);border-top:1px solid var(--line)}
.list>.secrow:first-child{border-top:0}

.btn{border:0;border-radius:99px;padding:14px 20px;font-weight:700;background:var(--btn);color:var(--btn-ink);font-size:1.05rem;box-shadow:0 3px 0 var(--sun)}
.btn:active,.continue:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.warm{background:var(--rose);color:#fff;box-shadow:none}
:root[data-theme="dark"] .btn.warm{color:#3A0E1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.warm{color:#3A0E1E}}
.btn.wide{width:100%}
.btn.again{background:var(--leaf-soft);color:var(--ink);border:2px solid var(--btn);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.grade:focus-visible,.choice:focus-visible,.tab:focus-visible,.saybtn:focus-visible,.rflip:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* せつめい */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--rose-soft);color:var(--rose-ink);border-radius:12px;padding:12px 14px;font-weight:700}
.ex{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.big-ex{font-family:var(--f-display);font-size:2rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.pairs div{background:var(--sunk);border-radius:10px;padding:6px 8px;text-align:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.kana-row{display:flex;flex-wrap:wrap;gap:6px}
.kana-row span{background:var(--sunk);border-radius:10px;min-width:44px;padding:4px 8px;text-align:center;font-family:var(--f-kj);font-size:1.4rem}
.wordtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.wt{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--sunk);border:0;border-radius:12px;padding:8px 4px}
.wt .em{font-size:2rem;line-height:1.2}
.wt b{font-family:var(--f-kj);font-size:1.05rem;font-weight:600}
.kktab{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kktab div{background:var(--sunk);border-radius:10px;padding:6px 4px;text-align:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:.98rem}

/* 花の絵（かぞえる） */
.bls{max-width:100%;height:auto;display:block;margin:0 auto}
.bl .p{fill:var(--sun)} .bl .c{fill:var(--brown)}
.bl.b .p{fill:var(--rose)} .bl.b .c{fill:var(--sun)}
.bl.gone{opacity:.32}
.bl .x{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.picrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.picrow .and{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.box2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box2>div{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.box2 b{font-family:var(--f-display);font-size:1.2rem}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plate{background:var(--sunk);border:2px solid var(--line);border-radius:999px;padding:6px 10px}
.nline{width:100%;height:auto;display:block}
.nline .ax{stroke:var(--muted);stroke-width:2}
.nline text{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13px}
.nline circle{fill:var(--sun)}
.fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.fig text{fill:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:700}
.fig .ld{stroke:var(--muted);stroke-width:1.2}
.fig .soil{fill:var(--soil)}
.fig .stem{stroke:var(--stem);stroke-width:4;fill:none;stroke-linecap:round}
.fig .leaf{fill:var(--stem)}
.fig .root{stroke:var(--brown);stroke-width:2.4;fill:none;stroke-linecap:round}
.fig .seed{fill:var(--brown)}

/* もんだい */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.qbox{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.qbox .prompt{color:var(--muted);font-size:.98rem;font-weight:700}
.qbox .expr{font-family:var(--f-display);font-size:2.1rem;font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.35}
.qbox .expr.txt{font-family:var(--f-body);font-size:1.12rem;font-weight:700;line-height:1.8;text-align:left}
.qbox .expr.pic{font-size:1rem;width:100%}
.qbox .emoji{font-size:4.2rem;line-height:1.15}
.qbox .word{font-family:var(--f-kj);font-size:2.2rem;font-weight:600;letter-spacing:.08em}
.qbox .blank{display:inline-block;min-width:1.2em;border:3px dashed var(--sun);border-radius:8px;color:transparent}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 8px;font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;min-height:64px}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.12rem;padding:12px;text-align:left;font-family:var(--f-body)}
.choices.kana .choice{font-family:var(--f-kj);font-weight:600;font-size:1.7rem}
.choices.emj .choice{font-size:2.4rem}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)} .feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.2rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--rose-soft);color:var(--rose-ink);border-radius:12px;padding:12px 14px;font-size:.98rem}
.linkbtn{border:0;background:none;color:var(--leaf);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.saybtn{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:4px 16px;font-size:1rem;font-weight:700}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--leaf);line-height:1.1}
.waterget{display:flex;align-items:center;gap:12px}
.waterget svg{width:44px;height:44px;flex:none}
.waterget div{flex:1;min-width:0}

/* はなたば */
.potbox{display:flex;gap:12px;align-items:center}
.potbox .stg{width:120px;height:auto;flex:none}
.potbox>div{flex:1;min-width:0}
.bq{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.bq .wrapp{fill:var(--wrap);stroke:var(--wrap-line);stroke-width:1.5}
.bq .slot{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.bq .stem{stroke:var(--stem);stroke-width:3;stroke-linecap:round}
.bq .bow{fill:var(--rose)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shelf>div{background:var(--sunk);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--muted)}
.shelf svg{width:100%;height:auto}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zk{background:var(--sunk);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.zk svg{width:64px;height:64px}
.zk b{font-family:var(--f-display);font-size:.92rem}
.zk span{font-size:.7rem;color:var(--muted);line-height:1.45}
.zk.no{opacity:.55}
button.zk{font:inherit;color:inherit;border:0;cursor:pointer}
.zfilter{display:flex;gap:6px;flex-wrap:wrap}
.zf{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.zf.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s,border-color .3s}
.fcard .bed{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 48%,var(--glow) 0,transparent 66%),var(--sunk);border-bottom:2px dashed var(--line)}
.fcard .bed svg{position:absolute;left:12%;top:12%;width:76%;height:76%}
.s-haru{--glow:rgba(246,150,185,.42)}.s-natsu{--glow:rgba(100,185,250,.36)}.s-aki{--glow:rgba(240,145,60,.38)}.s-fuyu{--glow:rgba(160,175,255,.4)}
.fno{position:absolute;top:8px;left:10px;font-size:.72rem;letter-spacing:.1em;color:var(--muted)}
.fse{position:absolute;top:7px;right:8px;font-size:.7rem;font-weight:700;padding:0 9px;border-radius:99px;background:var(--surface);color:var(--muted)}
.finfo{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.fname{font-size:1.15rem}
.finfo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:.84rem;line-height:1.55}
.finfo dt{color:var(--leaf);font-weight:700;font-size:.74rem;padding-top:3px;white-space:nowrap}
.finfo dd{margin:0}
.fword{font-size:.82rem;line-height:1.6;border-top:1px dashed var(--line);padding-top:6px}
.fword::before{content:"ひとこと";display:block;font-size:.68rem;font-weight:700;color:var(--leaf);letter-spacing:.1em}
.fcard.locked svg{filter:brightness(0);opacity:.14}
:root[data-theme="dark"] .fcard.locked svg{filter:brightness(0) invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fcard.locked svg{filter:brightness(0) invert(1)}}
.fcard.flash{border-color:var(--btn);box-shadow:0 0 0 3px var(--btn)}
.zrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fphoto{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;border:0;border-radius:99px;padding:3px 10px 3px 4px;background:var(--surface);color:var(--ink);font-size:.74rem;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fphoto img{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block}
.coll button img{pointer-events:none}

const FL = () => { let p=''; for(let i=0;i<5;i++){ const a=(i*72-90)*Math.PI/180; p+=`<circle class="p" cx="${(Math.cos(a)*6).toFixed(1)}" cy="${(Math.sin(a)*6).toFixed(1)}" r="5.6"/>`; } return p+`<circle class="c" r="4"/>`; };

const WNEED = 10;

const BQ_SIZE = 5;
function gInit(){ if(!R.garden){ R.garden={ water:0, fed:0, sp:nextSp([]), cur:[], done:[], got:[] }; save(); } return R.garden; }

    if(g==='芽') s+=`<ellipse class="leaf" cx="58" cy="${110-h}" rx="12" ry="6" transform="rotate(-20 58 ${110-h})"/><ellipse class="leaf" cx="82" cy="${110-h}" rx="12" ry="6" transform="rotate(20 82 ${110-h})"/>`;

const BQ_POS = [[110,58],[70,80],[150,80],[90,108],[130,108]];

const WATER_I = `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 20h22v16a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="var(--leaf)"/><path d="M30 24l12-10" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/><path d="M30 20c4-8 4-12-2-12H14" fill="none" stroke="var(--leaf)" stroke-width="3"/><circle cx="44" cy="20" r="2" fill="var(--sun)"/><circle cx="41" cy="25" r="1.6" fill="var(--sun)"/></svg>`;
function gWater(arg){
  const g=gInit(), before=growOf(g.fed).n; const n=Math.min(arg==='all'?g.water:1, g.water, WNEED-g.fed); if(n<=0) return;

const plain = ch => ch.normalize('NFD').replace(/[゙゚]/g,'').normalize('NFC');
const hasMark = ch => plain(ch)!==ch;
const swapMark = ch => { const p=plain(ch); const d=(p+'゙').normalize('NFC'), h=(p+'゚').normalize('NFC'); if(ch===d && h.length===1) return h; if(ch===h && d.length===1) return d; return p; };
function typo(w, mode){
  const cs=[...w];
  if(mode==='small'){ const i=cs.findIndex(c=>SMALL[c]); if(i>=0){ cs[i]=SMALL[cs[i]]; return cs.join(''); } }
  if(mode==='mark'){ const i=cs.findIndex(hasMark); if(i>=0){ cs[i]=Math.random()<.5?plain(cs[i]):swapMark(cs[i]); return cs.join(''); } }
  const idx=shuffle(cs.map((_,i)=>i)).find(i=>SIM[cs[i]]); if(idx!=null){ cs[idx]=SIM[cs[idx]]; return cs.join(''); }
  return null;
}

function cardPanel(from){
  const zn=SP.filter(sp=>zHas(sp.id)).length, pn=FCARDS.filter(pHas).length;
  return `<div class="panel stack"><div class="zrow"><h3>カード　<span class="num muted small">${zn+pn} / ${SP.length+FCARDS.length}</span></h3><button class="linkbtn" data-act="zk" data-arg="" data-from="${from}">ひらく ›</button></div>
  <p class="small"><b>花ずかん</b>　<span class="num muted">${zn} / ${SP.length}</span></p>
  ${zn?`<div class="zukan">${SP.filter(sp=>zHas(sp.id)).map(sp=>`<button class="zk" data-act="zk" data-arg="${sp.id}" data-from="${from}">${flowerIcon(sp.id)}<b>${sp.name}</b><span>${sp.season}の 花</span></button>`).join('')}</div>`:''}
  <p class="small"><b>花しゃしん</b>　<span class="num muted">${pn} / ${FCARDS.length}</span></p>
  ${pn?`<div class="coll">${FCARDS.map((c,i)=>pHas(c)?`<button data-act="cardview" data-arg="${i}" aria-label="${esc(c.name)}"><img src="${esc(c.src)}" alt="" loading="lazy"></button>`:'').join('')}</div>`:''}
  <div class="meter"><i style="width:${(zn+pn)/(SP.length+FCARDS.length)*100}%"></i></div>
  <p class="small muted">たんげんの 雨つぶを ぜんぶ クリアすると、カードが 1まい とどくよ。「花ずかん」か「花しゃしん」の どちらかだよ。</p></div>`;
}
function lightbox(){
  if(!S.lb) return '';
  const L=S.lb.list, k=S.lb.k, c=L[k];
  return `<div class="lb" role="dialog" aria-modal="true" aria-label="しゃしん" data-act="lbclose"><img src="${esc(c.src)}" alt="${esc(c.name)}"><div class="cap"><b>${esc(c.name)}</b>${c.note?`<span>${esc(c.note)}</span>`:''}</div>
  <div class="nav">${L.length>1?`<button class="ghost" data-act="lbmove" data-arg="-1" aria-label="まえの しゃしん">‹</button><span class="cnt">${k+1} / ${L.length}</span><button class="ghost" data-act="lbmove" data-arg="1" aria-label="つぎの しゃしん">›</button>`:''}<button data-act="lbclose">とじる</button></div></div>`;
}
const SEA = { はる:'haru', なつ:'natsu', あき:'aki', ふゆ:'fuyu' };
function fCard(sp,i,open){
  const no='No.'+String(i+1).padStart(2,'0');
  return `<article class="fcard ${open?'':'locked'} s-${SEA[sp.season]}" id="fc-${sp.id}"><div class="bed"><span class="fno num">${no}</span><span class="fse">${sp.season}</span><svg viewBox="-27 -27 54 54" role="img" aria-label="${open?sp.name+'の イラスト':'まだ ひらいていない カード'}"><g class="${open?'sway':''}">${head(sp.id,22)}</g></svg>${open&&photosOf(sp.id).length?`<button class="fphoto" data-act="photos" data-arg="${sp.id}" aria-label="${sp.name}の 花しゃしんを 見る"><img src="${photosOf(sp.id)[0].src}" alt="">花しゃしん ${photosOf(sp.id).length}</button>`:''}</div>
  <div class="finfo">${open?`<h3 class="fname">${sp.name}</h3><dl><dt><ruby>生息地<rt>せいそくち</rt></ruby></dt><dd>${sp.h}</dd><dt><ruby>花言葉<rt>はなことば</rt></ruby></dt><dd>${sp.m}</dd></dl><p class="fword">${sp.note}</p>`:`<h3 class="fname">？？？</h3><p class="small muted">${sp.season}の 花。たんげんを クリアして カードを あつめよう。</p>`}</div></article>`;
}
function vZukan(){
  const ss=['すべて','はる','なつ','あき','ふゆ','花しゃしん'], cur=S.zs||'すべて';
  const zn=SP.filter(sp=>zHas(sp.id)).length, pn=FCARDS.filter(pHas).length;
  const body = cur==='花しゃしん'
    ? `<div class="coll big">${FCARDS.map((c,i)=>pHas(c)?`<button data-act="cardview" data-arg="${i}" aria-label="${esc(c.name)}"><img src="${esc(c.src)}" alt="" loading="lazy"></button>`:`<div class="num">${i+1}</div>`).join('')}</div>`
    : `<div class="fgrid">${SP.map((sp,i)=>({sp,i})).filter(o=>cur==='すべて'||o.sp.season===cur).map(({sp,i})=>fCard(sp,i,zHas(sp.id))).join('')}</div>`;
  return `${top('花ずかん')}<div class="stack">
  <div class="hello"><div class="eyebrow">FLOWER FIELD GUIDE</div><h1>花ずかん</h1><p class="small muted">花ずかん <b class="num">${zn}</b> / ${SP.length}　花しゃしん <b class="num">${pn}</b> / ${FCARDS.length}</p></div>
  <div class="zfilter" role="group" aria-label="しゅるい">${ss.map(x=>`<button class="zf ${x===cur?'on':''}" data-act="zseason" data-arg="${x}" aria-pressed="${x===cur}">${x}</button>`).join('')}</div>
  ${body}
  <p class="small muted">たんげんの 雨つぶを ぜんぶ クリアすると、カードが 1まい とどくよ。</p></div>`;
}
function vRecord(){
  const acc=R.answered?Math.round(R.correct/R.answered*100):0, set=new Set(R.days); let cells='';
  for(let i=27;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); cells+=`<div class="day ${set.has(dkey(d))?'on':''}">${d.getDate()}</div>`; }
  const units=Object.entries(UNITS).filter(([uid])=>doneCount(uid)>0);
  return `<div class="stack"><div class="hello"><div class="eyebrow">きろく</div><h1>べんきょうの きろく</h1></div>
  <div class="panel stack"><h3>この 4しゅうかん</h3><div class="days">${cells}</div></div>
  <div class="panel"><div class="kv"><span>といた もんだい</span><b class="num">${R.answered}もん</b></div><div class="kv"><span>正かいりつ</span><b class="num">${acc}%</b></div><div class="kv"><span>れんぞく</span><b class="num">${streak()}日</b></div><div class="kv"><span>さいた 花</span><b class="num">${R.garden?R.garden.got.length:0}しゅるい</b></div><div class="kv"><span>あつめた カード</span><b class="num">${nGot()}まい</b></div></div>
  ${cardPanel('record')}
  ${units.length?units.map(([uid,u])=>`<div class="panel"><h3 style="margin-bottom:6px">${u.gname}　${u.subject}　${u.title}</h3>${u.lessons.map((l,i)=>`<div class="kv"><span>${i+1}　${l.t}</span>${lTag(uid,l.id)}</div>`).join('')}</div>`).join(''):'<p class="small muted">雨つぶを クリアすると、ここに きろくが ならぶよ。</p>'}</div>`;
}
function vSettings(){
  const send = !GAS_URL ? `<span class="status">そうしんさきが まだ せっていされていません</span>` : R.outbox.length ? `<span class="status wait">そうしんまち ${R.outbox.length}けん（つながったら おくります）</span>` : `<span class="status ok">先生に そうしん ずみ</span>`;
  return `<div class="stack"><div class="hello"><div class="eyebrow">せってい</div><h1>せいと じょうほう</h1></div>
  <div class="panel stack"><label for="st-code"><b>じぶんの ID</b></label><input type="text" id="st-code" value="${esc(R.code)}" maxlength="6" autocomplete="off" style="text-transform:uppercase"><p class="small muted">そつぎょう するまで おなじ ID を つかうよ（れい：A0001）</p>
  <p><b>学年</b></p>${gradeChips(myGrade(),'setGrade')}<p class="small muted">4がつに なると、じどうで 1つ あがるよ。</p>
  <label for="st-name"><b>よびな</b></label><input type="text" id="st-name" value="${esc(R.name)}" maxlength="12" autocomplete="off"></div>
  <div class="panel stack"><h3>先生への きろく</h3><p class="small">${send}</p><p class="small muted">雨つぶを おえるたびに、ID・よびな・学年・てんすう・かかった じかんが 先生に とどきます。</p></div></div>`;
}
function vInstall(){
  return `${top('ホームがめんに ついか')}<div class="stack">
  <div class="panel stack"><h3>iPhone・iPad（Safari）</h3><ol class="steps"><li>したの きょうゆうボタン（□に↑）を タップ</li><li>「ホーム画面に追加」を えらぶ</li><li>右上の「追加」を タップ</li></ol></div>
  <div class="panel stack"><h3>Android（Chrome）</h3><ol class="steps"><li>右上の「︙」メニューを タップ</li><li>「ホーム画面に追加」か「アプリをインストール」を えらぶ</li></ol></div></div>`;
}

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, quiz:vQuiz, result:vResult, garden:vGarden, zukan:vZukan, record:vRecord, settings:vSettings, install:vInstall };
function render(){
  app.innerHTML=VIEWS[S.view]()+lightbox();
  tabs.hidden = S.view==='setup';
  const tabFor={record:'record',settings:'settings',garden:'garden',zukan:S.zFrom||'garden'}[S.view]||'home';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));
  const c=document.getElementById('st-code'), n=document.getElementById('st-name');
  if(c) c.addEventListener('change',e=>{ const v=normCode(e.target.value); if(CODE_RE.test(v)){ R.code=v; save(); } e.target.value=R.code; });
  if(n) n.addEventListener('input',e=>{ R.name=e.target.value.trim(); save(); });
  if(S.view==='quiz'){ const Q=S.quiz, q=Q.qs[Q.i]; if(q.say && q.wordHTML && Q.picked===null && Q.said!==Q.i){ Q.said=Q.i; } }
}
function answerQ(i){
  const Q=S.quiz, q=Q.qs[Q.i], ok=q.choices[i]===q.answer; Q.picked=i; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);
  markDay(); save(); render();
}

document.addEventListener('keydown', e=>{ if(!S.lb) return; if(e.key==='Escape'){ S.lb=null; render(); } else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const n=S.lb.list.length; S.lb.k=(S.lb.k+(e.key==='ArrowRight'?1:-1)+n)%n; render(); } });
document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.lb=null; S.stack=[]; S.bloom=null; S.gmsg=''; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, arg=b.dataset.arg;
  if(a==='back') back();
  else if(a==='openLetter'){ if(S.letter){ S.letter.open=true; render(); } }
  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='go') go(arg);
  else if(a==='say') say(arg);
  else if(a==='course'){ S.course=arg; go('course'); }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='pickGrade'){ const c=document.getElementById('su-code'), nm=document.getElementById('su-name'), cv=c?c.value:'', nv=nm?nm.value:''; S.setupGrade=+arg; render(); document.getElementById('su-code').value=cv; document.getElementById('su-name').value=nv; }
  else if(a==='setGrade'){ setGrade(+arg); render(); }
  else if(a==='setupDone'){ const code=normCode(document.getElementById('su-code').value), err=document.getElementById('su-err');
    if(!CODE_RE.test(code)){ err.textContent='IDは「A0001」のように、アルファベット1文字と すうじ4けたで 入れてね。'; err.hidden=false; return; }
    if(!S.setupGrade){ err.textContent='なん年生か えらんでね。'; err.hidden=false; return; }
    R.code=code; R.name=document.getElementById('su-name').value.trim(); setGrade(S.setupGrade); save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid){ S.uid=b.dataset.uid; const u=CU(); S.course=u.course; S.subj=u.subj; } S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject','unit']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(+arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotWater=false; S.letter=makeLetter(Q.score,Q.qs.length);
    if(!Q.retry){ const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=doneCount(S.uid)===u.lessons.length, n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      report({ subject:u.gname+' '+u.subject, unit:u.title, lesson:String(lNo(u,l)), title:l.t, score:Q.score, total:n, sec:Math.round((Date.now()-S.lessonStart)/1000) });
      if(!wasDone && doneCount(S.uid)===u.lessons.length){ S.reward=drawReward(); if(S.reward) S.reward.title=u.title; }
      if(first){ const g=gInit(); g.water++; S.gotWater=true; save(); } }
    S.view='result'; render(); window.scrollTo(0,0); }
  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='water'){ gWater(arg); render(); }
  else if(a==='photos'){ S.lb={ list:photosOf(arg), k:0 }; render(); }
  else if(a==='cardview'){ const got=FCARDS.filter(pHas); S.lb={ list:got, k:Math.max(0,got.indexOf(FCARDS[+arg])) }; render(); }
  else if(a==='lbmove'){ const n=S.lb.list.length; S.lb.k=(S.lb.k+(+arg)+n)%n; render(); }
  else if(a==='lbclose'){ if(e.target.closest('.lb img,.lb .cap')) return; S.lb=null; render(); }
  else if(a==='zphoto'){ S.zs='花しゃしん'; S.zFrom='garden'; go('zukan'); }
  else if(a==='zseason'){ S.zs=arg; render(); }
  else if(a==='zk'){ S.zs='すべて'; S.zFrom=b.dataset.from||'garden'; go('zukan'); const el=arg&&document.getElementById('fc-'+arg); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1500); } }
  else if(a==='toGarden'){ S.stack=[]; S.bloom=null; S.gmsg=''; S.view='garden'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject']; S.view='unit'; render(); window.scrollTo(0,0); }
});

render(); flush();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

</body></html>
